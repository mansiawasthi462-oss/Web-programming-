name: CI - CRUD smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/webprog

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start API
        run: |
          nohup node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/ && break
            sleep 1
          done

      - name: Run CRUD smoke test
        run: node scripts/smoke-test.js

      - name: Show server log on failure
        if: failure()
        run: cat server.log
